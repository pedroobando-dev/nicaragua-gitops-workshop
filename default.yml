      enable_activities_webhook: true
      destination_url: https://webhook.site/e857e290-b055-4320-9b9f-c95cc756f8a9
  org_info:
    org_name: Fleet
  secrets:
    - secret: "$FLEET_GLOBAL_ENROLL_SECRET"
